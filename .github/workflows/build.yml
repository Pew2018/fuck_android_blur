name: Build Pixel Blur Controller

on:
  push:
    branches: [main, "ci/**", "fix/**"]
    paths-ignore:
      - pixelblur-controller-install.zip
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-build-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="$ANDROID_SDK_ROOT"
          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -perm -111 2>/dev/null | sort | tail -n 1)"
          fi
          if [ -z "$SDKMANAGER" ]; then echo "sdkmanager not found under $SDK_ROOT" >&2; exit 1; fi
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          export PATH="$(dirname "$SDKMANAGER"):$SDK_ROOT/platform-tools:$PATH"
          /usr/bin/yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "ndk;27.2.12479018"

      - name: Install build and preview tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build zip unzip
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Syntax checks
        shell: bash
        run: |
          set -euo pipefail
          sh -n service.sh action.sh global_blur.sh uninstall.sh
          bash -n build.sh
          node --check webroot/app.js
          node --check .github/scripts/preview.mjs

      - name: Build and verify module ZIP
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          chmod +x build.sh service.sh action.sh global_blur.sh uninstall.sh
          ./build.sh

      - name: Render WebUI light and dark previews
        run: |
          mkdir -p preview-artifacts
          node .github/scripts/preview.mjs

      - name: Upload installable module ZIP
        uses: actions/upload-artifact@v4
        with:
          name: pixelblur-controller-module
          path: pixelblur-controller-install.zip
          if-no-files-found: error

      - name: Upload WebUI previews
        uses: actions/upload-artifact@v4
        with:
          name: pixelblur-controller-webui-previews
          path: preview-artifacts/*.png
          if-no-files-found: error

      - name: Publish direct install download on fix branch
        if: startsWith(github.ref, 'refs/heads/fix/') || github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f pixelblur-controller-install.zip
          if ! git diff --cached --quiet; then
            git commit -m "build: update direct install package"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          printf '\n[Download Pixel Blur Controller installer](https://github.com/%s/raw/refs/heads/%s/pixelblur-controller-install.zip)\n' "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
